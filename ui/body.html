<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="3"/><path d="M24 9v6M24 33v6M9 24h6M33 24h6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M24 14l6 20-6-4-6 4z" fill="currentColor"/></svg>
      <div>
        <h1>Навигатор</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="tools">
      <select id="lang" class="sel" aria-label="Јазик / Language"><option value="mk">Македонски</option><option value="en">English</option></select>
      <button id="themeBtn" class="icon-btn" type="button" data-i18n-aria="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg></button>
    </div>
  </header>

  <main class="layout">
    <section class="card" id="console" aria-labelledby="h-console">
      <h2 id="h-console" data-i18n="console"></h2>
      <div id="status" class="status" role="status" aria-live="assertive"><i></i><span id="statusText"></span></div>

      <div class="nowrow">
        <div class="dial"><svg id="dial" viewBox="0 0 220 220" role="img" data-i18n-aria="dialLabel"></svg></div>
        <div class="read">
          <div><span class="num" id="meters">—</span><span class="unit" id="unit">m</span></div>
          <div class="lbl" data-i18n="toNext"></div>
          <div class="clock" id="clock">—</div>
          <div class="lbl" id="total"></div>
        </div>
      </div>

      <p class="instruction" id="instruction" aria-live="assertive"></p>

      <div class="haptic" aria-hidden="true">
        <div class="pad L" id="hapL"><i></i><i></i></div>
        <p id="hapText"></p>
        <div class="pad R" id="hapR"><i></i></div>
      </div>

      <h3 class="sub" data-i18n="goTo"></h3>
      <div class="row dests" id="dests"></div>

      <label class="check" id="depthRow" hidden><input id="depthToggle" type="checkbox" checked><span data-i18n="depth"></span></label>

      <h3 class="sub" data-i18n="command"></h3>
      <div class="cmd">
        <input id="cmd" class="field" type="text" data-i18n-ph="cmdPh" autocomplete="off">
        <button id="micBtn" class="btn ghost" type="button" data-i18n-aria="mic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button id="cmdBtn" class="btn" type="button">OK</button>
      </div>

      <h3 class="sub" data-sim data-i18n="simulate"></h3>
      <div class="row" data-sim>
        <button id="stopBtn" class="btn danger" type="button" data-i18n="stop"></button>
        <button id="resumeBtn" class="btn ghost" type="button" data-i18n="resume"></button>
        <button id="lostBtn" class="btn ghost" type="button" data-i18n="lose"></button>
        <button id="relocBtn" class="btn ghost" type="button" data-i18n="reloc"></button>
        <button id="resetBtn" class="btn ghost" type="button" data-i18n="reset"></button>
      </div>
    </section>

    <section class="card" id="mapcard" aria-labelledby="h-map">
      <h2 id="h-map" data-i18n="map"></h2>
      <div class="mapwrap"><canvas id="map" width="1440" height="1200" role="img" data-i18n-aria="mapLabel"></canvas></div>
      <p class="screenoff" id="screenoff" hidden></p>
      <div class="legend" id="legend"></div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="card" id="profile" aria-labelledby="h-profile">
      <h2 id="h-profile" data-i18n="profile"></h2>
      <fieldset class="presets" id="presets">
        <legend class="sr" style="position:absolute;left:-9999px" data-i18n="preset"></legend>
        <label><input type="radio" name="preset" value="blind"><span data-i18n="p_blind"></span></label>
        <label><input type="radio" name="preset" value="lowvision"><span data-i18n="p_low"></span></label>
        <label><input type="radio" name="preset" value="wheelchair" checked><span data-i18n="p_wheel"></span></label>
        <label><input type="radio" name="preset" value="combined"><span data-i18n="p_comb"></span></label>
      </fieldset>

      <div class="fld">
        <label for="acuity" data-i18n="acuity"></label>
        <input id="acuity" class="field" type="number" min="0" max="1.2" step="0.01" value="1" inputmode="decimal">
        <small data-i18n="acuityHelp"></small>
      </div>
      <div class="two">
        <div class="fld"><label for="field" data-i18n="fieldLoss"></label>
          <select id="field" class="field"><option value="none"></option><option value="tunnel"></option><option value="left"></option><option value="right"></option><option value="central"></option></select></div>
        <div class="fld"><label for="light" data-i18n="light"></label>
          <select id="light" class="field"><option value="normal"></option><option value="light-only"></option><option value="none"></option></select></div>
      </div>
      <div class="two" id="wheelFields">
        <div class="fld"><label for="width" data-i18n="width"></label><input id="width" class="field" type="number" min="60" max="120" value="65" inputmode="numeric"></div>
        <div class="fld"><label for="thr" data-i18n="thr"></label><input id="thr" class="field" type="number" min="0" max="8" step="0.5" value="2" inputmode="decimal"></div>
      </div>
      <div class="fld"><label for="approved" data-i18n="approved"></label>
        <select id="approved" class="field"><option value="self"></option><option value="professional"></option></select></div>

      <div class="derived" aria-live="polite">
        <div><b id="dPass">—</b><span data-i18n="dPass"></span></div>
        <div><b id="dStep">—</b><span data-i18n="dStep"></span></div>
        <div><b id="dOut">—</b><span data-i18n="dOut"></span></div>
      </div>
      <ul class="warns" id="warnings" aria-live="polite"></ul>
    </section>

    <section class="card" id="logcard" aria-labelledby="h-log">
      <h2 id="h-log" data-i18n="log"></h2>
      <ol class="log" id="log" aria-live="polite"></ol>
    </section>

    <section class="card" id="vault" data-sim aria-labelledby="h-vault">
      <h2 id="h-vault" data-i18n="vault"></h2>
      <div class="fld" style="margin-top:0"><label for="pass" data-i18n="pass"></label><input id="pass" class="field" type="password" autocomplete="off"><small data-i18n="vaultHelp"></small></div>
      <div class="row" style="margin-top:12px">
        <button id="saveBtn" class="btn ghost" type="button" data-i18n="save"></button>
        <button id="loadBtn" class="btn ghost" type="button" data-i18n="load"></button>
      </div>
      <p class="hint" id="vaultMsg" role="status"></p>
    </section>
  </main>

  <p class="note" data-i18n="note"></p>
</div>
